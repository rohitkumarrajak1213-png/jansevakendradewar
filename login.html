<!DOCTYPE html>
<html lang="hi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login - Jan Seva Kendra Dewar</title>

    <!-- CSS (Design) yahi andar hi likha hai -->
    <style>
        body {
            background-color: #f4f7f6;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        
        .login-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        
        .login-container h2 {
            color: #003366;
            margin-bottom: 20px;
        }
        
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: bold;
        }
        
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        
        .login-btn {
            width: 100%;
            padding: 10px;
            background-color: #003366;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .login-btn:hover {
            background-color: #002244;
        }
        
        .back-home {
            margin-top: 15px;
            display: block;
            color: #003366;
            text-decoration: none;
            font-size: 14px;
        }
        
        .back-home:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="login-container">
        <h2>Jan Seva Kendra Login</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="mobile">Mobile Number ya Customer ID</label>
                <input type="text" id="mobile" placeholder="Apna 10-digit mobile number dalein" required>
            </div>

            <div class="form-group">
                <label for="password">Password / OTP</label>
                <input type="password" id="password" placeholder="Password ya OTP dalein" required>
            </div>

            <button type="submit" class="login-btn">Login Karein</button>
        </form>

        <a href="index.html" class="back-home">&larr; Wapas Home Page par jayein</a>
    </div>

    <!-- JavaScript (Logic) yahi andar hi likha hai -->
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Page reload hone se rokta hai

            const mobile = document.getElementById('mobile').value;

            if (mobile.length === 10) {
                alert('Login successful! Dashboard par redirect kiya ja raha hai.');
                // Yahan aap dashboard par bhej sakte hain
                window.location.href = 'index.html';
            } else {
                alert('Kripya sahi 10-digit mobile number darj karein.');
            }
        });
    </script>

</body>

</html>
